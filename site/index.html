<script>
  // Pick the theme before first paint so there is no flash: saved choice, else the system setting.
  (function () {
    var t = 'golden';

      var saved = localStorage.getItem('undumployed:theme');
      t = saved === 'storm' || saved === 'golden' ? saved : (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'storm' : 'golden');

    document.documentElement.setAttribute('data-theme', t);
