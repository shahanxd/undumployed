name: Check links

on:
  pull_request:
  schedule:
    - cron: "0 3 1 * *" # monthly, 1st at 03:00 UTC
  workflow_dispatch:

jobs:
  lychee:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Link check
        id: lychee
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress
            --accept 200,201,202,203,204,206,301,302,303,307,308,403,429,999
            --timeout 30
            --max-retries 2
            --exclude-mail
            --exclude-path .github
            "**/*.md"
          fail: false
      - name: Open issue on failures (scheduled runs only)
        if: github.event_name == 'schedule' && steps.lychee.outputs.exit_code != 0
        uses: peter-evans/create-issue-from-file@v5
        with:
          title: "Link check: broken links found"
          content-filepath: ./lychee/out.md
          labels: fix, automated
